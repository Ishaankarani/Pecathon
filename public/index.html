<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Small Web Reader - Embedded Reader Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f7f5f0;
            --bg-surface: #ffffff;
            --border-color: #e5e0d8;
            --text-main: #2c2a29;
            --text-muted: #78716c;
            --accent: #849b82;
            --accent-hover: #6d826b;
        }

        [data-theme="dark"] {
            --bg-base: #1c1a19;
            --bg-surface: #262423;
            --border-color: #3d3a38;
            --text-main: #f5f2eb;
            --text-muted: #a8a29e;
            --accent: #a3b8a1;
            --accent-hover: #b8ccb6;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Sidebar */
        aside {
            width: 300px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        aside h2 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
            font-size: 1.4rem;
        }

        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .section-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"] {
            padding: 10px 14px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        button {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            margin-top: 8px;
            font-size: 0.85rem;
        }
        button:hover { background: var(--accent-hover); }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-secondary:hover { background: var(--border-color); }

        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 10px 12px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            margin-bottom: 6px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Main Content Layout (Split into Feed List & Reader Pane) */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Timeline / Article list column */
        .feed-column {
            width: 45%;
            padding: 30px;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        /* Embedded Reader View column */
        .reader-column {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: var(--bg-surface);
            box-sizing: border-box;
        }

        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            width: auto;
            margin: 0;
            padding: 0 0 4px 0;
            border-radius: 0;
            font-size: 0.85rem;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: var(--text-main);
            border-bottom-color: var(--accent);
        }

        .article-card {
            background: var(--bg-surface);
            padding: 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .article-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .article-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            margin: 4px 0;
            line-height: 1.3;
        }

        .empty-state {
            color: var(--text-muted);
            font-style: italic;
            padding: 40px 0;
            text-align: center;
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body data-theme="light">

    <aside>
        <div class="sidebar-header">
            <h2>journal.</h2>
            <button class="theme-toggle-btn" onclick="toggleTheme()">Dark</button>
        </div>
        
        <div class="section-title">Add Feed</div>
        <input type="text" id="feedUrl" placeholder="Paste RSS / Atom URL...">
        <button onclick="addFeed()">Subscribe</button>

        <div class="section-title">Subscriptions</div>
        <ul id="subList"></ul>

        <div class="section-title">Discover</div>
        <button onclick="shareAnonymousBatch()">Share Anonymous Subs</button>
        <button class="btn-secondary" onclick="loadRecommendations()">Load Recommendations</button>
    </aside>

    <main>
        <!-- Left Pane: Article List -->
        <div class="feed-column">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('timeline', this)">Timeline</button>
                <button class="tab-btn" onclick="switchTab('discover', this)">Discover</button>
            </div>

            <div id="timelineView">
                <h3 style="font-family:'Playfair Display', serif; font-weight:400; margin-top:0;">Feed Articles</h3>
                <div id="timeline">
                    <div class="empty-state">Select a feed from your sidebar.</div>
                </div>
            </div>

            <div id="discoverView" style="display: none;">
                <h3 style="font-family:'Playfair Display', serif; font-weight:400; margin-top:0;">Recommendations</h3>
                <div id="recommendationList">
                    <div class="empty-state">Click "Load Recommendations" in sidebar.</div>
                </div>
            </div>
        </div>

        <!-- Right Pane: Embedded Reader View -->
        <div class="reader-column" id="readerPane">
            <div class="empty-state" style="margin-top: 100px;">
                <h3 style="font-style:normal; margin-bottom: 5px;">No article selected</h3>
                <p style="font-size: 0.85rem;">Click any article on the left to read it right here.</p>
            </div>
        </div>
    </main>

    <script>
        let subscriptions = JSON.parse(localStorage.getItem('subs')) || [];

        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle-btn');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = 'Light';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                btn.textContent = 'Dark';
                localStorage.setItem('theme', 'light');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        document.querySelector('.theme-toggle-btn').textContent = savedTheme === 'dark' ? 'Light' : 'Dark';

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(tabName === 'timeline') {
                document.getElementById('timelineView').style.display = 'block';
                document.getElementById('discoverView').style.display = 'none';
            } else {
                document.getElementById('timelineView').style.display = 'none';
                document.getElementById('discoverView').style.display = 'block';
            }
        }

        function renderSubs() {
            const list = document.getElementById('subList');
            list.innerHTML = '';
            if(subscriptions.length === 0) {
                list.innerHTML = '<li style="background:transparent; border:none; color:var(--text-muted); cursor:default;">No subscriptions</li>';
                return;
            }
            subscriptions.forEach((sub, index) => {
                const li = document.createElement('li');
                const cleanName = sub.replace('https://','').replace('http://','').split('/')[0];
                li.innerHTML = `
                    <span style="flex: 1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 6px;" onclick="loadFeedPosts('${sub}')">${cleanName}</span>
                    <button onclick="removeFeed(event, ${index})" style="width: auto; margin: 0; padding: 2px 5px; font-size: 0.65rem; background: transparent; border: 1px solid var(--border-color); color: var(--text-muted);">✕</button>
                `;
                list.appendChild(li);
            });
            localStorage.setItem('subs', JSON.stringify(subscriptions));
        }

        function removeFeed(event, index) {
            event.stopPropagation();
            if(confirm('Remove feed?')) {
                subscriptions.splice(index, 1);
                renderSubs();
                document.getElementById('timeline').innerHTML = '<div class="empty-state">Select a feed.</div>';
            }
        }

        function addFeed() {
            const urlInput = document.getElementById('feedUrl').value.trim();
            if(!urlInput) return;
            if(subscriptions.includes(urlInput)) { alert('Already subscribed!'); return; }
            subscriptions.push(urlInput);
            document.getElementById('feedUrl').value = '';
            renderSubs();
            alert('Added successfully!');
        }

        async function loadFeedPosts(feedUrl) {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = `<div class="empty-state">Loading stories...</div>`;
            try {
                const res = await fetch(`/api/fetch?url=${encodeURIComponent(feedUrl)}`);
                const xmlText = await res.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const items = xmlDoc.querySelectorAll("item, entry");

                if(items.length === 0) {
                    timeline.innerHTML = `<div class="empty-state">No articles found.</div>`;
                    return;
                }

                timeline.innerHTML = '';
                items.forEach(item => {
                    const title = item.querySelector("title")?.textContent || "Untitled";
                    const link = item.querySelector("link")?.getAttribute("href") || item.querySelector("link")?.textContent || "#";
                    
                    // Look for description, summary, or content tags
                    let content = item.querySelector("content")?.textContent || 
                                  item.querySelector("description")?.textContent || 
                                  item.querySelector("summary")?.textContent || "";
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = content;
                    const cleanContent = tempDiv.textContent || tempDiv.innerText || "Click the source link below to read the full story on their official page.";

                    const card = document.createElement('div');
                    card.className = 'article-card';
                    card.onclick = () => openReaderView(title, link, cleanContent);
                    card.innerHTML = `
                        <span style="font-size:0.65rem; text-transform:uppercase; color:var(--text-muted);">Article</span>
                        <h3>${title}</h3>
                    `;
                    timeline.appendChild(card);
                });
            } catch(e) {
                timeline.innerHTML = `<div class="empty-state">Failed to load feed.</div>`;
            }
        }
        // Embedded Reader View Function
        function openReaderView(title, link, content) {
            const readerPane = document.getElementById('readerPane');
            readerPane.innerHTML = `
                <h1 style="font-family:'Playfair Display', serif; font-size: 1.8rem; margin-top:0; line-height:1.3;">${title}</h1>
                <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom: 20px;">Source Link: <a href="${link}" target="_blank" style="color:var(--accent);">${link}</a></p>
                <hr style="border:0; border-top:1px solid var(--border-color); margin-bottom:20px;">
                <div style="font-size: 0.95rem; line-height: 1.8; color: var(--text-main);">
                    ${content || 'No summary available. Click the link above to view the full page.'}
                </div>
            `;
        }

        async function shareAnonymousBatch() {
            if(subscriptions.length === 0) { alert('Add a subscription first!'); return; }
            const res = await fetch('/api/discover/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ feeds: subscriptions })
            });
            const data = await res.json();
            alert(data.message || 'Shared!');
        }

        async function loadRecommendations() {
            const recList = document.getElementById('recommendationList');
            recList.innerHTML = '<div class="empty-state">Loading...</div>';
            const res = await fetch('/api/discover/recommendations');
            const data = await res.json();
            
            recList.innerHTML = '';
            if(!data.recommendations || data.recommendations.length === 0) {
                recList.innerHTML = '<div class="empty-state">No recommendations yet.</div>';
                return;
            }

            data.recommendations.forEach(rec => {
                if(subscriptions.includes(rec.feed)) return;
                const card = document.createElement('div');
                card.className = 'article-card';
                card.innerHTML = `
                    <span style="font-size:0.65rem; color:var(--text-muted);">Score ${rec.score}</span>
                    <h3 style="font-size:0.9rem; word-break:break-all;">${rec.feed}</h3>
                    <button style="margin-top:8px; padding:6px;" onclick="addRecommendedFeed('${rec.feed}')">Follow</button>
                `;
                recList.appendChild(card);
            });
        }

        function addRecommendedFeed(feedUrl) {
            if(!subscriptions.includes(feedUrl)) {
                subscriptions.push(feedUrl);
                renderSubs();
                alert('Added!');
            }
        }

        renderSubs();
    </script>
</body>
</html>
